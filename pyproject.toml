# サービス版（Vercel）の設定。ローカル版は requirements.txt で入れる（README）。
[project]
name = "battle-support"
version = "0.1.0"
requires-python = ">=3.12"
# サービス版の実行に要るものだけ（画像の読み取り・データ取得・テストの依存は入れない）
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.vercel]
entrypoint = "service.main:app"

# /static は CDN から配る（認証のミドルウェアは /api だけに効く）
[tool.vercel.fastapi.static]
cdn = true
