# サービス版（Vercel）の設定。ローカル版は requirements.txt で入れる（README）。
[project]
name = "gyakudame-note"
version = "0.1.0"
requires-python = ">=3.12"
# サービス版の実行に要るものだけ（データ取得・テストの依存は入れない）。画像の読み取りは pillow・numpy（OCRは Google）
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pillow>=10",
    "numpy>=1.26",
]

[tool.vercel]
entrypoint = "service.main:app"

# /static は CDN から配る（認証のミドルウェアは /api だけに効く）
[tool.vercel.fastapi.static]
cdn = true
